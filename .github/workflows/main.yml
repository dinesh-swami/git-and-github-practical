name: Basic CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check repository
        run: |
          echo "GitHub Actions is running!"
          echo "Checking files..."
          ls

      - name: Test home.html
        run: |
          test -f home.html
          echo "home.html exists - Test passed!"
